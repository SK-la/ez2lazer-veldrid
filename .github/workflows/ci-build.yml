name: CI build

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    name: Build and test pack
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/Veldrid.sln

      - name: Build
        run: dotnet build src/Veldrid.sln -c Release --no-restore

      - name: Pack (smoke)
        run: |
          dotnet pack src/Veldrid/Veldrid.csproj -c Release --no-restore /p:Version=0.0.0-ci
          Get-ChildItem -Recurse bin/Packages/Release/*.nupkg
